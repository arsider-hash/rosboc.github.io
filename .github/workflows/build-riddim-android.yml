name: Build ARSIDER RIDDIM Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'riddim/**'
      - 'capacitor/**'
      - '.github/workflows/build-riddim-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: capacitor

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: capacitor/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Capacitor
        run: npm install

      - name: Generate Android project
        run: npx cap add android

      - name: Disable long-press, selection and browser gestures natively
        run: |
          mkdir -p android/app/src/main/java/org/arsider/riddim
          cat > android/app/src/main/java/org/arsider/riddim/MainActivity.java <<'JAVA'
          package org.arsider.riddim;

          import android.os.Bundle;
          import android.view.View;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              WebView webView = getBridge().getWebView();

              // Performance surface belongs to the instrument, not Android text UI.
              webView.setLongClickable(false);
              webView.setOnLongClickListener(v -> true);
              webView.setHapticFeedbackEnabled(false);
              webView.setOverScrollMode(View.OVER_SCROLL_NEVER);

              WebSettings settings = webView.getSettings();
              settings.setSupportZoom(false);
              settings.setBuiltInZoomControls(false);
              settings.setDisplayZoomControls(false);

              getWindow().getDecorView().setSystemUiVisibility(
                  View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY
                | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION
                | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION
              );
            }
          }
          JAVA

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ARSIDER-RIDDIM-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ARSIDER-RIDDIM-APK
          path: capacitor/ARSIDER-RIDDIM-debug.apk
          if-no-files-found: error
