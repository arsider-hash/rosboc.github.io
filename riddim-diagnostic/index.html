<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>ARSIDER DIAGNOSTIC</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:#0a0a0a;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
main{max-width:720px;margin:auto;padding:14px}
h1{font-size:22px;margin:0 0 10px}
small{color:#aaa}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
button{min-height:88px;border:1px solid #444;border-radius:14px;background:#171717;color:#fff;font-size:22px;font-weight:900;touch-action:manipulation}
button.ok{background:#d9ff48;color:#000}
#xy{height:260px;border:2px solid #666;border-radius:16px;position:relative;touch-action:none;background:linear-gradient(#181818,#050505);overflow:hidden}
#dot{width:44px;height:44px;border:3px solid #d9ff48;border-radius:50%;position:absolute;transform:translate(-50%,-50%);display:none}
#log{white-space:pre-wrap;background:#111;border:1px solid #333;border-radius:12px;padding:10px;min-height:180px;font:13px/1.4 ui-monospace,monospace;color:#9ff}
.row{display:flex;gap:8px;margin:10px 0}
.row button{flex:1;min-height:58px;font-size:16px}
</style>
</head>
<body>
<main>
<h1>ARSIDER DIAGNOSTIC <small>v3</small></h1>
<div class="grid">
<button id="tap">1 TAP</button>
<button id="audio">2 WEBAUDIO</button>
<button id="htmlaudio">3 HTML AUDIO</button>
<button id="buttons">4 BUTTONS</button><button id="clear">CLEAR LOG</button>
</div>
<div id="xy"><div id="dot"></div></div>
<div class="row"><button id="a">A</button><button id="b">B</button><button id="c">C</button></div>
<div id="log">READY</div>
</main>
<script>
(()=>{'use strict';
const log=document.getElementById('log');
const xy=document.getElementById('xy');
const dot=document.getElementById('dot');
const lines=[];
function out(s){lines.unshift(new Date().toLocaleTimeString()+'  '+s);log.textContent=lines.slice(0,18).join('\n')}
window.addEventListener('error',e=>out('JS ERROR: '+e.message));
document.getElementById('clear').onclick=()=>{lines.length=0;log.textContent='CLEARED'};
document.getElementById('tap').addEventListener('click',e=>{e.currentTarget.classList.toggle('ok');out('CLICK TAP')});
document.getElementById('tap').addEventListener('pointerdown',e=>out('POINTERDOWN TAP '+e.pointerType));
document.getElementById('tap').addEventListener('touchstart',e=>out('TOUCHSTART TAP'),{passive:true});

let ctx=null;
document.getElementById('audio').addEventListener('click',async e=>{
 try{
  ctx=ctx||new (window.AudioContext||window.webkitAudioContext)({latencyHint:'interactive'});
  if(ctx.state==='suspended')await ctx.resume();
  const now=ctx.currentTime;

  const osc=ctx.createOscillator(),og=ctx.createGain();
  osc.type='square';osc.frequency.value=1000;
  og.gain.setValueAtTime(0.95,now);
  og.gain.setValueAtTime(0.95,now+1.4);
  og.gain.exponentialRampToValueAtTime(0.001,now+1.6);
  osc.connect(og);og.connect(ctx.destination);osc.start(now);osc.stop(now+1.61);

  const len=Math.floor(ctx.sampleRate*0.45),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*0.9;
  const src=ctx.createBufferSource(),ng=ctx.createGain();
  src.buffer=buf;ng.gain.value=0.8;src.connect(ng);ng.connect(ctx.destination);src.start(now+1.75);

  e.currentTarget.classList.add('ok');
  out('WEBAUDIO FIRED state='+ctx.state+' rate='+ctx.sampleRate);
 }catch(err){out('WEBAUDIO FAIL '+err.message)}
});

function makeWavBlob(){
 const sr=44100,dur=1.6,n=Math.floor(sr*dur),buf=new ArrayBuffer(44+n*2),v=new DataView(buf);
 const w=(o,str)=>{for(let i=0;i<str.length;i++)v.setUint8(o+i,str.charCodeAt(i))};
 w(0,'RIFF');v.setUint32(4,36+n*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
 v.setUint32(24,sr,true);v.setUint32(28,sr*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,n*2,true);
 for(let i=0;i<n;i++){
   const t=i/sr;
   let x=Math.sign(Math.sin(2*Math.PI*880*t))*0.92;
   if(t>1.2)x*=Math.max(0,(1.6-t)/0.4);
   v.setInt16(44+i*2,Math.max(-32767,Math.min(32767,x*32767)),true);
 }
 return new Blob([buf],{type:'audio/wav'});
}
document.getElementById('htmlaudio').addEventListener('click',async e=>{
 try{
  const url=URL.createObjectURL(makeWavBlob());
  const a=new Audio(url);a.volume=1;
  a.onended=()=>URL.revokeObjectURL(url);
  await a.play();
  e.currentTarget.classList.add('ok');
  out('HTML AUDIO PLAYING volume='+a.volume);
 }catch(err){out('HTML AUDIO FAIL '+err.message)}
});
document.getElementById('buttons').addEventListener('click',e=>{e.currentTarget.classList.toggle('ok');out('BUTTONS MASTER CLICK')});
['a','b','c'].forEach(id=>{
 const el=document.getElementById(id);
 el.addEventListener('click',()=>out('CLICK '+id.toUpperCase()));
 el.addEventListener('pointerdown',e=>out('POINTER '+id.toUpperCase()+' '+e.pointerType));
 el.addEventListener('touchstart',()=>out('TOUCH '+id.toUpperCase()),{passive:true});
});

function pos(x,y,kind){
 const r=xy.getBoundingClientRect();
 const px=Math.max(0,Math.min(1,(x-r.left)/r.width));
 const py=Math.max(0,Math.min(1,(y-r.top)/r.height));
 dot.style.display='block';dot.style.left=(px*100)+'%';dot.style.top=(py*100)+'%';
 out(kind+' XY x='+px.toFixed(2)+' y='+py.toFixed(2));
}
xy.addEventListener('pointerdown',e=>{try{xy.setPointerCapture(e.pointerId)}catch(_){};pos(e.clientX,e.clientY,'POINTERDOWN')});
xy.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')pos(e.clientX,e.clientY,'POINTERMOVE')});
xy.addEventListener('pointerup',e=>out('POINTERUP XY '+e.pointerType));
xy.addEventListener('touchstart',e=>{const t=e.touches[0];if(t){e.preventDefault();pos(t.clientX,t.clientY,'TOUCHSTART')}},{passive:false});
xy.addEventListener('touchmove',e=>{const t=e.touches[0];if(t){e.preventDefault();pos(t.clientX,t.clientY,'TOUCHMOVE')}},{passive:false});
xy.addEventListener('touchend',e=>{e.preventDefault();out('TOUCHEND XY')},{passive:false});
out('INIT OK');
})();
</script>
</body>
</html>
